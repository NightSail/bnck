[package]
name = 'bnck'
version = '0.1.0'
edition = '2024'

[dependencies]
anyhow = '1.0'
anstream = '1.0'
anstyle = '1.0'
clap = { version = '4.5', features = ['derive'] }
csv = '1.3'
flate2 = '1.1'
quick-xml = '0.38'
rusqlite = { version = '0.37', features = ['bundled'] }
semver = '1.0'
serde = { version = '1.0', features = ['derive'] }
serde_json = '1.0'
sha2 = '0.10'
toml = '0.9'
walkdir = '2.5'
xz2 = '0.1'
zip = { version = '4.6', default-features = false, features = ['deflate'] }
zstd = '0.13'

[dev-dependencies]
tempfile = '3.23'
