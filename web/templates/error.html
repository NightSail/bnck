{% extends 'base.html' %}
{% from 'components.html' import search_form with context %}
{% block content %}
<section class='error-page'>
	<p class='eyebrow'>error {{ page.status }}</p>
	<h1>{{ page.title }}</h1>
	<p class='lead'>{{ page.message }}</p>
	{{ search_form() }}
	<p class='search-hint' id='search-hint'>Search by full or partial name.
		<a href='/?q='>browse names →</a></p>
</section>
{% endblock %}
