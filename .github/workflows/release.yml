name: Release

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      release:
        description: Optional CalVer identifier; leave blank to assign the next one
        required: false
        type: string

run-name: Dataset release ${{ inputs.release || 'automatic' }}

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan dataset release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      force: ${{ steps.plan.outputs.force }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release identifier
        id: plan
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: ./.github/scripts/plan-release.sh

  acquire:
    name: Acquire ${{ matrix.channel }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        channel: [debian, fedora, arch, homebrew, crates-io, npm, pypi]
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
        with:
          just-version: '1.58.0'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ matrix.channel }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Acquire channel
        env:
          CHANNEL: ${{ matrix.channel }}
        run: ./.github/scripts/acquire-channel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: acquired-${{ matrix.channel }}
          path: var/acquired
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build dataset
    needs: [plan, acquire]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: cloudflare-pages
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.digest.outputs.changed }}
      dataset_tag: ${{ steps.dataset.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
        with:
          just-version: '1.58.0'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-release
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - uses: actions/download-artifact@v4
        with:
          pattern: acquired-*
          path: var/acquired
          merge-multiple: true
      - name: Generate providers
        env:
          BNCK_CANDIDATE_ONLY: '1'
        run: just generate
      - name: Check for dataset changes
        id: digest
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ needs.plan.outputs.force }}
          PREVIOUS_TAG: ${{ needs.plan.outputs.previous_tag }}
        run: ./.github/scripts/check-dataset-changes.sh
      - name: Install release tools
        if: steps.digest.outputs.changed == 'true'
        run: ./.github/scripts/install-release-tools.sh
      - name: Configure signing key
        if: steps.digest.outputs.changed == 'true'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: ./.github/scripts/configure-signing-key.sh
      - name: Build and sign release
        if: steps.digest.outputs.changed == 'true'
        env:
          BNCK_CANDIDATE_ONLY: '1'
          RELEASE: ${{ needs.plan.outputs.release }}
        run: just release "$RELEASE"
      - name: Publish GitHub Release
        if: steps.digest.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.plan.outputs.release }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: ./.github/scripts/publish-github-release.sh
      - name: Select dataset release tag
        id: dataset
        env:
          CHANGED: ${{ steps.digest.outputs.changed }}
          NEW_TAG: ${{ needs.plan.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.plan.outputs.previous_tag }}
        run: ./.github/scripts/select-dataset-tag.sh

  site:
    name: Build and deploy site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: cloudflare-pages
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
        with:
          just-version: '1.58.0'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-site
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Download released SQLite artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.dataset_tag }}
        run: ./.github/scripts/download-released-sqlite.sh
      - name: Generate static site
        run: just generate-site
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
