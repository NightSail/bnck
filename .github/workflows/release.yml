name: Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: CalVer release identifier, for example 2026-10-22.1
        required: true
        type: string

run-name: Release ${{ inputs.release }}

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release }}
  cancel-in-progress: false

jobs:
  acquire:
    name: Acquire ${{ matrix.channel }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        channel: [debian, fedora, arch, homebrew, crates-io, npm, pypi]
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
        with:
          just-version: '1.58.0'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ matrix.channel }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Acquire channel
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            debian)
              just fetch-debian
              just import-debian
              ;;
            fedora)
              just fetch-fedora
              just import-fedora
              ;;
            arch)
              just fetch-arch
              just import-arch
              ;;
            homebrew)
              just fetch-homebrew
              just import-homebrew
              ;;
            crates-io)
              just fetch-crates-dump
              just import-crates-dump
              ;;
            npm)
              snapshot='var/input/npm-ci'
              rm -rf "$snapshot"
              just fetch-npm "$snapshot"
              just import-npm "$snapshot" 'var/acquired/npm.jsonl'
              ;;
            pypi)
              snapshot='var/input/pypi-ci'
              rm -rf "$snapshot"
              just fetch-pypi-metadata "$snapshot"
              just fetch-pypi-wheels "$snapshot"
              cargo run --release --quiet --bin bnck -- import-pypi \
                --plan "$snapshot/wheels.json" \
                --output 'var/acquired/pypi.jsonl' \
                --scope 'index=https://pypi.org/simple/' \
                --scope 'release-policy=latest-non-yanked-stable' \
                --scope 'wheel-policy=prefer-universal-then-smallest' \
                --scope 'catalog-policy=bounded-non-atomic-scan'
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: acquired-${{ matrix.channel }}
          path: var/acquired
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build and publish
    needs: acquire
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: cloudflare-pages
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
        with:
          just-version: '1.58.0'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-release
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - uses: actions/download-artifact@v4
        with:
          pattern: acquired-*
          path: var/acquired
          merge-multiple: true
      - name: Install release tools
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign zstd
      - name: Configure signing key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$MINISIGN_SECRET_KEY"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > minisign.key
          chmod 600 minisign.key
          test -f minisign.pub
      - name: Generate and release
        env:
          BNCK_CANDIDATE_ONLY: '1'
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          just generate
          just release "$RELEASE"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          tag="bnck-$RELEASE"
          if gh release view "$tag" >/dev/null 2>&1; then
            printf 'Release %s already exists\n' "$tag" >&2
            exit 1
          fi
          gh release create "$tag" \
            "var/releases/bnck-$RELEASE.tar.zst" \
            "var/releases/bnck-$RELEASE/SHA256SUMS" \
            "var/releases/bnck-$RELEASE/SHA256SUMS.minisig" \
            --title "bnck $RELEASE" \
            --notes "Dataset release $RELEASE."
      - uses: actions/upload-artifact@v4
        with:
          name: dataset-sqlite
          path: var/releases/bnck-${{ inputs.release }}/bnck.sqlite.zst
          retention-days: 7

  site:
    name: Build and deploy site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: cloudflare-pages
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
        with:
          just-version: '1.58.0'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-site
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - uses: actions/download-artifact@v4
        with:
          name: dataset-sqlite
          path: var
      - name: Generate static site
        run: just generate-site
      - name: Deploy Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy var/site --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --branch=${{ github.event.repository.default_branch }}
